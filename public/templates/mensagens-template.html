<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagens das FamÃ­lias</title>
    <style>
      @page { size: A4; margin: 14mm; }
      :root {
        --paper: #f0e8de;
        --tag: #fffdf9;
        --ink: #2d2722;
        --ink-soft: #5f5449;
        --rope: #9d7d57;
        --line: rgba(140, 118, 87, 0.36);
        --gold: #a68352;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.7), transparent 40%),
          radial-gradient(circle at 100% 100%, rgba(190, 155, 112, 0.16), transparent 35%),
          var(--paper);
        color: var(--ink);
        font-family: "Cormorant Garamond", "Times New Roman", serif;
      }
      .page { padding: 6px; }
      .print-sheet {
        width: 100%;
        min-height: calc(297mm - 28mm);
        display: flex;
        align-items: center;
        justify-content: center;
        page-break-after: always;
      }
      .print-sheet:last-of-type { page-break-after: auto; }

      .tag-scene {
        position: relative;
        width: 95mm;
        min-height: 152mm;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 0;
      }

      .gift-tag {
        position: absolute;
        top: 8mm;
        width: 86mm;
        min-height: 138mm;
        padding: 15mm 4mm 4mm;
        border: 1px solid var(--line);
        border-radius: 2.6mm;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)),
          var(--tag);
        box-shadow: 0 10px 22px rgba(47, 32, 17, 0.16);
        overflow: hidden;
      }

      .gift-tag::before {
        content: '';
        position: absolute;
        inset: 2.3mm;
        border: 1px solid rgba(140, 118, 87, 0.24);
        border-radius: 1.8mm;
        pointer-events: none;
      }

      .frame-inner {
        position: relative;
        min-height: 126mm;
        width: 100%;
        border: 1px solid rgba(140, 118, 87, 0.28);
        background:
          radial-gradient(rgba(109, 84, 53, 0.045) 0.55px, transparent 0.75px),
          linear-gradient(160deg, rgba(255, 255, 255, 0.82), rgba(245, 236, 223, 0.6)),
          var(--tag);
        background-size: 4px 4px, 100% 100%, 100% 100%;
        border-radius: 1.4mm;
        padding: 13mm 6mm 7mm;
        overflow: hidden;
      }

      .ornament {
        position: absolute;
        width: 10mm;
        height: 10mm;
        border-top: 1px solid rgba(166, 131, 82, 0.42);
        border-left: 1px solid rgba(166, 131, 82, 0.42);
        border-radius: 1px;
        pointer-events: none;
        transform-origin: center;
      }
      .ornament::before,
      .ornament::after {
        content: "";
        position: absolute;
        border: 1px solid rgba(166, 131, 82, 0.42);
        width: 5.6mm;
        height: 5.6mm;
        transform: rotate(45deg);
      }
      .ornament::before { bottom: -3.7mm; right: 2.2mm; }
      .ornament::after { bottom: 2.2mm; right: -3.7mm; }
      .ornament-top-left { top: 2.6mm; left: 2.6mm; transform: rotate(180deg); }
      .ornament-top-right { top: 2.6mm; right: 2.6mm; transform: rotate(270deg); }
      .ornament-bottom-left { bottom: 2.6mm; left: 2.6mm; transform: rotate(90deg); }
      .ornament-bottom-right { bottom: 2.6mm; right: 2.6mm; transform: rotate(0deg); }

      .divider {
        margin: 3.2mm auto 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--gold);
      }
      .divider span {
        display: block;
        width: 16mm;
        height: 1px;
        background: linear-gradient(
          to right,
          rgba(166, 131, 82, 0),
          rgba(166, 131, 82, 0.75),
          rgba(166, 131, 82, 0)
        );
      }
      .divider i {
        margin: 0;
        font-style: normal;
        font-size: 7px;
        letter-spacing: 0.2em;
      }

      .card-header {
        text-align: center;
        padding: 3mm 1mm 0;
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        margin: 0;
        font: 600 7.8px/1.2 "Arial", sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #8c7a62;
      }

      h1 {
        margin: 2.8mm 0 0;
        font: 600 13.5px/1.14 "Playfair Display", "Times New Roman", serif;
        letter-spacing: 0.015em;
        color: #2f2923;
      }

      .event-meta {
        margin-top: 2mm;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8mm;
        font: 600 7.6px/1.2 "Arial", sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #74614a;
      }

      .event-meta strong {
        font-size: 8px;
        letter-spacing: 0.2em;
      }

      blockquote {
        margin: 6.5mm 0 0;
        border: 0;
        padding: 0;
        text-align: center;
        white-space: pre-wrap;
        font: 500 11.6px/1.45 "Cormorant Garamond", "Times New Roman", serif;
        color: var(--ink-soft);
        min-height: 70mm;
        position: relative;
        z-index: 1;
      }
      .actions {
        position: sticky;
        bottom: 0;
        background: linear-gradient(to top, rgba(244, 239, 232, 0.98), rgba(244, 239, 232, 0));
        padding: 14px 8px 8px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font: 600 13px/1 "Arial", sans-serif;
        cursor: pointer;
      }
      .print-btn { background: #7a5a2f; color: #fff; }
      .close-btn { background: #e5e7eb; color: #111827; }

      @media print {
        body { background: #fff; }
        .page { padding: 0; }
        .actions { display: none; }
        .gift-tag { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="print-sheet">
        <article class="tag-scene">
          <div class="gift-tag">
            <div class="frame-inner">
              <div class="ornament ornament-top-left"></div>
              <div class="ornament ornament-top-right"></div>
              <div class="ornament ornament-bottom-left"></div>
              <div class="ornament ornament-bottom-right"></div>
              <header class="card-header">
                <h1></h1>
                <div class="event-meta">
                  <strong>Janeth &amp; Felipe</strong>
                  <span>24 Abril 2026</span>
                </div>
                <div class="divider">
                  <span></span>
                  <i>&bull;&bull;&bull;</i>
                  <span></span>
                </div>
              </header>
              <blockquote></blockquote>
            </div>
          </div>
        </article>
      </section>

      <div class="actions">
        <button class="close-btn" onclick="window.close()">Fechar</button>
        <button class="print-btn" onclick="window.print()">Imprimir</button>
      </div>
    </main>
  </body>
</html>
